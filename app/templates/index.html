<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Analyzer - OpenRTB Inspector</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <h1>📊 Bid Analyzer</h1>
                <p>OpenRTB Request & Response Inspector</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Mode Selector -->
            <div class="mode-selector">
                <label for="mode-select">Select Analysis:</label>
                <select id="mode-select">
                    <option value="request">📋 Bid Request Analyzer</option>
                    <option value="response">📨 Bid Response Analyzer</option>
                    <option value="compare">⚖️ Compare Request & Response</option>
                </select>
            </div>

            <div class="content-grid">
                <!-- Input Panel -->
                <div class="input-panel">
                    <h2>Input</h2>

                    <!-- Request Mode -->
                    <div class="mode-content" id="input-request">
                        <div class="input-group">
                            <label>Paste JSON:</label>
                            <textarea id="request-raw" placeholder='{"id":"req-1","imp":[...]}'></textarea>
                        </div>

                        <div class="button-group">
                            <button class="btn-secondary" onclick="document.getElementById('request-file').click()">📁 Upload File</button>
                            <select id="request-sample" class="select-input">
                                <option value="">Choose Sample...</option>
                            </select>
                            <button class="btn-secondary" onclick="loadSample('request')">Load</button>
                            <input id="request-file" type="file" style="display:none;" accept=".json,.txt,.log">
                        </div>
                    </div>

                    <!-- Response Mode -->
                    <div class="mode-content" id="input-response" style="display:none;">
                        <div class="input-group">
                            <label>Paste JSON:</label>
                            <textarea id="response-raw" placeholder='{"id":"req-1","seatbid":[...]}'></textarea>
                        </div>

                        <div class="button-group">
                            <button class="btn-secondary" onclick="document.getElementById('response-file').click()">📁 Upload File</button>
                            <select id="response-sample" class="select-input">
                                <option value="">Choose Sample...</option>
                            </select>
                            <button class="btn-secondary" onclick="loadSample('response')">Load</button>
                            <input id="response-file" type="file" style="display:none;" accept=".json,.txt,.log">
                        </div>
                    </div>

                    <!-- Compare Mode -->
                    <div class="mode-content" id="input-compare" style="display:none;">
                        <div class="compare-inputs">
                            <div class="compare-input">
                                <h3>Bid Request</h3>
                                <textarea id="compare-request-raw" placeholder='{"id":"req-1","imp":[...]}'></textarea>
                                <button class="btn-secondary" onclick="document.getElementById('compare-request-file').click()">📁 Upload</button>
                                <input id="compare-request-file" type="file" style="display:none;" accept=".json,.txt,.log">
                            </div>
                            <div class="compare-input">
                                <h3>Bid Response</h3>
                                <textarea id="compare-response-raw" placeholder='{"id":"req-1","seatbid":[...]}'></textarea>
                                <button class="btn-secondary" onclick="document.getElementById('compare-response-file').click()">📁 Upload</button>
                                <input id="compare-response-file" type="file" style="display:none;" accept=".json,.txt,.log">
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button id="analyze-btn" class="btn-primary">▶ Analyze</button>
                        <button class="btn-secondary" onclick="clearInputs()">Clear</button>
                    </div>
                </div>

                <!-- Results Panel -->
                <div class="results-panel">
                    <h2>Results</h2>
                    <div id="results-placeholder" class="placeholder">
                        <p>✨ Upload or paste data and click Analyze</p>
                    </div>
                    <div id="results-content" style="display:none;">
                        <div class="results-tabs">
                            <button class="tab-btn active" onclick="switchTab('overview', this)">Overview</button>
                            <button class="tab-btn" onclick="switchTab('request', this)">Request</button>
                            <button class="tab-btn" onclick="switchTab('response', this)">Response</button>
                            <button class="tab-btn" onclick="switchTab('compare', this)">Compare</button>
                            <button class="tab-btn" onclick="switchTab('warnings', this)">Warnings</button>
                            <button class="tab-btn" onclick="switchTab('raw', this)">Raw</button>
                        </div>
                        <div class="tab-contents">
                            <div class="tab-content active" id="tab-overview"></div>
                            <div class="tab-content" id="tab-request"></div>
                            <div class="tab-content" id="tab-response"></div>
                            <div class="tab-content" id="tab-compare"></div>
                            <div class="tab-content" id="tab-warnings"></div>
                            <div class="tab-content" id="tab-raw"></div>
                        </div>
                        <div class="export-buttons">
                            <button class="btn-secondary" onclick="copyResults()">📋 Copy</button>
                            <button class="btn-secondary" onclick="exportJSON()">📄 JSON</button>
                            <button class="btn-secondary" onclick="exportHTML()">💾 HTML</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Status Message -->
        <div id="status-msg" class="status-msg"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
